[providers]
providers = ["php"]

[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "php82Extensions.pdo_pgsql", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.zip", "php82Extensions.gd"]

[phases.install]
cmds = ["cd backend && composer install --no-dev --optimize-autoloader --no-scripts --ignore-platform-reqs"]

[start]
cmd = "cd backend && php artisan migrate --force && php artisan db:seed --force && php artisan serve --host 0.0.0.0 --port $PORT"
